name: ayoslog
description: Offline-first asset maintenance tracker with green light and dark themes.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_local_notifications: ^19.0.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.15
flutter:
  uses-material-design: true
